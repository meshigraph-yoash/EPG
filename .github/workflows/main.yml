name: Update EPG Daily

on:
  schedule:
    - cron: '0 4 * * *' # רץ אוטומטית כל יום ב-04:00 UTC (06:00 בבוקר שעון ישראל)
  workflow_dispatch: # מאפשר הרצה ידנית בלחיצת כפתור

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run WebGrab+Plus
        uses: docker://linuxserver/webgrabplus:latest
        with:
          args: /bin/bash -c "cp -r /github/workspace/* /config/ && /app/wg++/bin/WebGrab+Plus.exe /config && cp /config/*.xml /github/workspace/"

      - name: Commit and push updated EPG
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto update EPG" || exit 0
          git push
