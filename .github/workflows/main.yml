name: Update EPG Daily

on:
  schedule:
    - cron: '0 4 * * *' # רץ אוטומטית כל יום ב-06:00 בבוקר שעון ישראל
  workflow_dispatch: # מאפשר הרצה ידנית

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run WebGrab+Plus
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/config" \
            --entrypoint /bin/bash \
            lscr.io/linuxserver/webgrabplus:latest \
            -c "/app/dotnet/dotnet /app/wg++/bin.net/WebGrab+Plus.dll /config"

      - name: Commit and push updated EPG
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto update EPG" || exit 0
          git push
